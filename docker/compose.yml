name: gods-eye-view
services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m]
    env_file: [/etc/gods-eye-view/runtime.env]
    environment:
      OCI_CONFIG_FILE: /etc/gods-eye-view/oci/config
      GODS_EYE_VIEW_URL: http://viewer:8081
    volumes:
      - /etc/gods-eye-view/oci:/etc/gods-eye-view/oci:ro
      - /var/lib/gods-eye-view/api:/var/lib/gods-eye-view:rw
    networks: [product]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
  viewer:
    image: ${VIEWER_IMAGE:?VIEWER_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m]
    env_file: [/etc/gods-eye-view/runtime.env]
    environment:
      GODS_EYE_VIEW_ADMIN_URL: http://api:8000
      GODS_EYE_VIEW_MODE: oci
      GODS_EYE_NATIVE_ENABLED: "true"
    volumes:
      - /var/lib/gods-eye-view/native-cache:/app/.upstream/.gev-cache:rw
    networks: [product]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    ports: ["443:443"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOST$
    volumes:
      - /etc/gods-eye-view/tls:/etc/nginx/tls:ro
    networks: [product]
    depends_on: [api, viewer]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=-", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 6s
      retries: 12
networks:
  product:
    driver: bridge
